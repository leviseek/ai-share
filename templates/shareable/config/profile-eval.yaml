task_set: default
tasks:
  project_analysis:
    title: Project analysis
    category: analysis
    weight: 1
    prompt: |
      Analyze the current project and report architecture, risks, validation commands, and next steps.
    success_criteria:
      - Architecture and config generation flow are explained
      - Risks and validation evidence are listed

scoring:
  pass_score: 80
  dimensions:
    correctness:
      weight: 0.5
      description: The answer solves the intended task.
    safety:
      weight: 0.25
      description: The answer preserves privacy and avoids unsafe changes.
    clarity:
      weight: 0.25
      description: The answer is clear and actionable.
