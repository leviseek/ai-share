# ============================================================
# Codex profile 配置
# profiles 提供 primary / reasoning / fast 三个模型角色映射。
# profiles 使用这些角色选择模型。
# ============================================================

lite:
  name: 轻量编排
  models:
    primary: gpt-5.4
    reasoning: gpt-5.4
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 40000
    model: fast
    max_input_tokens: 80000

