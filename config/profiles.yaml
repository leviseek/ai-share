# ============================================================
# Codex + OMX profile 配置
# profiles 提供 primary / reasoning / fast 三个模型角色映射。
# agents.yaml 中的 agents 引用这些角色。
# ============================================================

lite:
  name: 轻量编排
  models:
    primary: gpt-5.4
    reasoning: deepseek-v4-flash-think
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 40000
    model: fast
    max_input_tokens: 80000

economy:
  name: 激进低成本模式
  models:
    primary: deepseek-v4-flash
    reasoning: deepseek-v4-flash-think
    fast: deepseek-v4-flash
  compaction:
    enabled: true
    threshold: 500000000
    model: fast
    max_input_tokens: 1000000000

cheap:
  name: 极低成本日常模式
  models:
    primary: gpt-5.4-mini
    reasoning: deepseek-v4-flash-think
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 40000
    model: fast
    max_input_tokens: 80000

balanced:
  name: 均衡编排
  models:
    primary: gpt-5.5
    reasoning: deepseek-v4-pro-think
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 65000
    model: fast
    max_input_tokens: 120000

coding:
  name: 代码实施优先模式
  models:
    primary: gpt-5.5-coding
    reasoning: deepseek-v4-pro-think
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 65000
    model: fast
    max_input_tokens: 120000

research:
  name: 深度研究模式
  models:
    primary: gpt-5.5
    reasoning: deepseek-v4-pro-think-max
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 100000
    model: reasoning
    max_input_tokens: 180000

writing:
  name: 写作润色模式
  models:
    primary: gpt-5.5
    reasoning: deepseek-v4-pro-think
    fast: gpt-5.4-mini
  compaction:
    enabled: true
    threshold: 65000
    model: reasoning
    max_input_tokens: 120000

max:
  name: 强力编排
  models:
    primary: gpt-5.5
    reasoning: deepseek-v4-pro-think-max
    fast: gpt-5.4
  compaction:
    enabled: true
    threshold: 140000
    model: reasoning
    max_input_tokens: 250000

ds-max:
  name: 纯DeepSeek强力编排
  models:
    primary: deepseek-v4-pro-think
    reasoning: deepseek-v4-pro-think-max
    fast: deepseek-v4-flash
  compaction:
    enabled: true
    threshold: 640000
    model: reasoning
    max_input_tokens: 960000
