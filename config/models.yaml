# ==================== GPT 兼容模型组 ====================
# 成本字段沿用仓库约定：USD / 1K tokens；由 OpenAI 官方 USD / 1M tokens 价格换算。
# `model_name` 保持为上游 API 模型名；`gpt-*-coding` 是本仓库面向 Codex 的本地预设别名。
gpt-5.6-sol:
  provider_group: gpt
  model_name: gpt-5.6-sol
  capabilities:
    - flagship
    - coding
    - reasoning
    - planning
    - long_context
  cost:
    input: 0.005
    output: 0.03
  limits:
    context_window: 1000000
    max_output: 128000
  temperature: 0.2
  parameters:
    reasoningEffort: high
  fallback:
    - gpt-5.6-terra
    - gpt-5.6-luna

gpt-5.6-terra:
  provider_group: gpt
