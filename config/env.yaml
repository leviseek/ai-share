# Codex CLI 会读取 CODEX_HOME/.env。这里只放非密钥运行时变量。
# API Key、token、cookie、password 不要写在这里；继续使用系统环境变量或私有本机 .env。
# 如果本机代理端口不是 7890，修改这里后运行 bun run ai:gen -- --force 重新生成。
variables:
  HTTP_PROXY: http://127.0.0.1:7890
  HTTPS_PROXY: http://127.0.0.1:7890
  ALL_PROXY: socks5://127.0.0.1:7890
  NO_PROXY: localhost,127.0.0.1,::1
  http_proxy: http://127.0.0.1:7890
  https_proxy: http://127.0.0.1:7890
  all_proxy: socks5://127.0.0.1:7890
  no_proxy: localhost,127.0.0.1,::1
