default_profile: balanced

# Version compatibility requirements
codex_min_version: 0.134.0
omx_min_version: 0.18.4

env:
  mode: dev # dev / staging / prod
  log_level: info # debug / info / warn / error

features:
  auto_router: true
  memory: true
  fallback: true
  cost_tracking: true

runtime:
  timeout_ms: 120000
  max_retries: 2

models:
  default: gpt-5.5
  small: gpt-5.4-mini

context:
  max_tokens: 120000
  strategy: truncate # truncate / summarize / split
  cache_enabled: true

workspace:
  ignore:
    - .git/**
    - .sisyphus/evidence/**
    - node_modules/**
    - dist/**
    - build/**
    - target/**
    - .next/**
    - .nuxt/**
    - .svelte-kit/**
    - coverage/**
    - .cache/**
    - .turbo/**
    - .vite/**
    - bun.lock
    - package-lock.json
    - pnpm-lock.yaml
    - yarn.lock
    - .env
    - .env.*

compaction:
  enabled: true
  threshold: 65000

# telemetry:
#   enabled: true
#   endpoint: http://localhost:3000/log
