# 经过验证的开发、Git 和调试工作流规则

development:
  phases:
    - phase: 理解上下文
      actions:
        - 阅读项目上下文、已有模式和约定
        - 拆解核心需求、识别风险、定义验收标准
        - 推进前确认不确定项
    - phase: 制定计划
      actions:
        - 将确认方案转化为可执行步骤
        - 明确变更文件、测试范围、执行顺序
        - 关键改动使用 Git worktree 隔离
    - phase: 实现
      actions:
        - 新功能和 bugfix 遵循测试驱动开发
        - 先写失败测试，再写最小实现让测试通过
        - 测试通过后再重构
        - 每个步骤完成后运行相关检查
    - phase: 验证
      actions:
        - 运行类型检查、lint、构建和相关测试
        - 区分当前改动引入的问题和既有问题
        - 手动验证功能，不只依赖类型正确性
        - 运行项目实际可用的静态诊断
  task_management:
    - 多步骤工作使用 todo 列表，一次只进行一个任务
    - 完成后立即标记，不批量完成

git:
  rules:
    - 无明确用户要求不提交
    - 提交信息格式："option: 中文描述"
    - 不做破坏性操作：force push、amend、rebase -i
    - 不自动推送或创建分支，除非被要求
    - 只提交与任务相关的改动，提交前检查 diff
    - 尊重用户已有的工作区改动，避免触碰除非必要
    - 用户明确要求 commit、提交、push 或推送时，在当前会话中将对应 Git 操作委派给名为 ai-share-commit-operator 的 custom agent
    - 仅要求提交时不推送，仅要求推送时不提交工作区改动，同时要求提交并推送时才依次执行两者
  if_commit_fails:
    - 修复问题后创建新提交
    - 不 amend 除非满足条件

debugging:
  strategy:
    - 始终先定位根因，不表面修补
    - 重复失败时重新检查假设、最小复现和根因，不用绕过手段制造通过
    - 通过项目搜索或探索工具确认关键不确定性
  context_management:
    - 长调试过程中主动压缩工具输出
    - 不堆积原始日志，只保留失败摘要和关键路径
    - 长会话保留目标、进展、关键决策、失败摘要和下一步

quality_gates:
  - 每次改动后运行项目可用的静态诊断
  - 功能改动需要手动或集成验证
  - 确认完成前必须有可复查证据
