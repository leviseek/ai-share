# 跨设备配置 - 命令生成摘要
# stable/devices.yaml 是确认事实源；本文件只保留 shell/path 选择提示。

canonical_refs:
  stable_devices: memory/stable/devices.yaml
  wsl_details: memory/stack/wsl.md

default_device: windows

shell_rules:
  windows: PowerShell 7+ 语法，路径使用反斜杠或原始字符串
  wsl: bash 语法，路径使用正斜杠
  macos: zsh/bash 语法，路径使用正斜杠

security:
  api_keys: 每台设备单独设置环境变量，永不写入仓库
  codex_env: config/env.yaml 只生成非密钥运行时变量
