# 模型使用规则
# 作为 AI 行为约束：在选择模型时遵循本规则

default_model:
  model: gpt-5.5
  use: 默认日常编码，均衡质量与成本

model_catalog:
  gpt-5.5:
    use: 日常编码、bug 修复、小功能、通用推理
  gpt-5.5-coding:
    use: 代码实施优先，强调代码生成能力
  gpt-5.4:
    use: 轻量日常，上下文预算较高，成本低于 gpt-5.5
  gpt-5.4-mini:
    use: 极低成本，简单问答、文件操作、格式化、扫描任务

selection_rules:
  - condition: 简单问答、文件搜索、格式化
    model: gpt-5.4-mini
    reason: 不需要强大推理能力，节省 tokens
  - condition: 日常编码、bug 修复、小功能
    model: gpt-5.5
    reason: 质量好、成本适中
  - condition: 复杂代码生成、大型重构
    model: gpt-5.5-coding
    reason: coding 模型代码生成能力更强
  - condition: 架构设计、深度调试、研究问题
    model: gpt-5.5
    reason: 需要深度推理能力和较高上下文预算
  - condition: 资源受限或扫描任务
    model: gpt-5.4-mini
    reason: 使用 mini 降低成本
  - condition: 上下文太长逼近警戒线
    action: 先 rescue 再新 session，不强制恢复
    reason: 避免卡死，保护上下文预算

anti_patterns:
  - 不要用最高成本模型做简单文件搜索或问答
  - 不要用 gpt-5.4-mini 做架构设计或复杂调试
  - 不要手动修改生成的 config.toml 来更换模型—改 global.yaml 后重新生成
  - 不要在不清楚任务复杂度时默认使用最高级模型
